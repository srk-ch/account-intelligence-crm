<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Account Review</title>
<meta name="description" content="Live account review for Eastern Counties Police Alliance and Aldermoor Industrial Group.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg1:#dcdfe6;--bg2:#eef0f4;--shell:#f4f5f8;--panel:#eceef3;--card:#ffffff;--ink:#0d0e11;--ink2:#4a4f5b;--mute:#8c919d;--line:#e1e4ea;
  --blue:#5b8def;--blue-bg:#e4ecfd;--red:#e2564f;--red-bg:#fde8e6;--green:#2c9d69;--green-bg:#dff3e8;--amber:#c98a12;--amber-bg:#fbefd2;
  --font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r-xl:34px;--r-lg:26px;--r-md:18px;
  --sh:0 1px 1px rgba(20,24,40,.03),0 8px 24px -10px rgba(20,24,40,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font:14.5px/1.55 var(--font);color:var(--ink);background:radial-gradient(900px 600px at 80% -10%,#cfd9f7 0,transparent 60%),radial-gradient(800px 500px at 0% 100%,#d9d6f2 0,transparent 55%),linear-gradient(135deg,#e6ebf7,#dde4f4);-webkit-font-smoothing:antialiased;padding:18px}
button{font-family:inherit}
.num{font-variant-numeric:tabular-nums}

/* shell */
.shell{max-width:1360px;margin:0 auto;background:rgba(247,248,252,.74);backdrop-filter:blur(22px);border-radius:42px;box-shadow:0 30px 80px -30px rgba(20,24,40,.28),inset 0 0 0 1px rgba(255,255,255,.8);display:grid;grid-template-columns:78px minmax(0,1fr);min-height:calc(100vh - 36px)}

/* rail */
.rail{z-index:30;padding:22px 0 22px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;position:sticky;top:18px;align-self:start;height:calc(100vh - 36px)}
.rail .logo{display:none}.logo{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--sh);margin-bottom:10px}
.rb{width:46px;height:46px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink2);box-shadow:var(--sh);text-decoration:none;position:relative;transition:transform .15s,background .15s}
.rb:hover{transform:translateY(-1px);color:var(--ink)}
.rb.on{background:var(--ink);color:#fff}
.rb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rb .tip{position:absolute;left:60px;top:50%;transform:translate(-6px,-50%);background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;box-shadow:0 10px 24px -8px rgba(20,24,40,.5)}
.rb:hover .tip,.rb:focus-visible .tip{transform:translate(0,-50%)}
.rb:hover .tip{opacity:1}
.rail .sp{flex:1}
.rb.dot::after{content:"";position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid var(--card)}
.rb.dot.warn::after{background:var(--amber)}

/* main */
.main{padding:22px 34px 40px 22px;min-width:0}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:25;margin:-22px -34px 0 -22px;padding:16px 34px 12px 22px;background:linear-gradient(var(--shell) 70%,rgba(244,245,248,0));backdrop-filter:blur(6px);border-radius:42px 42px 0 0}
.pills{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
.pill{border:0;background:transparent;font-size:14px;font-weight:500;padding:9px 16px;border-radius:999px;cursor:pointer;color:var(--ink2);text-decoration:none}
.pill:hover{color:var(--ink)}
.pill.on{background:var(--ink);color:#fff;font-weight:600}
.tools{display:flex;gap:10px;align-items:center}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh);color:var(--ink)}
.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.status{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--card);border-radius:999px;padding:8px 14px;box-shadow:var(--sh)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.status i.on{background:var(--green);box-shadow:0 0 0 4px var(--green-bg)}.status i.warn{background:var(--amber)}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:30px 0 8px}
.head h1{font:800 40px/1.05 var(--font);letter-spacing:-.03em;margin:0}
.head .sub{color:var(--mute);font-size:14px;margin-top:6px;font-weight:500}
.avs{display:flex;gap:10px;align-items:center}
.av{position:relative;width:54px;height:54px;border-radius:50%;border:0;padding:0;cursor:pointer;font:700 15px var(--font);color:var(--ink);background:var(--card);box-shadow:var(--sh);outline:3px solid transparent;transition:outline-color .15s}
.av.on{outline-color:var(--ink)}
.av .bd{position:absolute;right:-3px;bottom:-3px;min-width:21px;height:21px;border-radius:999px;background:var(--red);color:#fff;font:700 11px/21px var(--font);text-align:center;border:2px solid var(--shell);padding:0 4px}
.avs small{font-size:12px;color:var(--mute);font-weight:600;margin-left:4px}

/* panels */
.panel{scroll-margin-top:84px;background:rgba(255,255,255,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),0 18px 40px -26px rgba(40,60,120,.3);border-radius:var(--r-xl);padding:26px 26px 28px;margin-top:20px;position:relative}
.panel>h2::before{content:attr(data-n);display:inline-grid;place-items:center;width:30px;height:30px;margin-right:12px;border-radius:50%;background:var(--ink);color:#fff;font:700 14px var(--font);vertical-align:2px}
.panel>h2[data-n='✎']::before{background:var(--green)}
.panel>h2{font:700 20px/1.2 var(--font);letter-spacing:-.015em;margin:0}
.panel>.cap{color:var(--mute);margin:4px 0 20px;font-size:13.5px;font-weight:500;max-width:720px}
.card{background:var(--card);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--sh)}
.lab{font:600 11px var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}

/* brief */
.brief{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.brief .card p{margin:8px 0 0;font:600 21px/1.45 var(--font);letter-spacing:-.015em}
.brief em{font-style:normal;background:var(--green-bg);border-radius:8px;padding:0 6px}
.brief em.bad{background:var(--red-bg)}
.next{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:22px}
.next .lab{color:#9aa0ae}.next h3{font:700 18px/1.35 var(--font);margin:10px 0 14px;letter-spacing:-.01em}
.next .nrow{display:flex;gap:8px;flex-wrap:wrap}.next .tg{background:rgba(255,255,255,.12);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}

.events{background:var(--red-bg);border-radius:var(--r-xl);padding:22px 26px;margin-top:20px}
.events .ev{background:var(--card);border-radius:var(--r-md);padding:14px 18px;margin-top:10px}
.events .ev b{font-size:15.5px}
.quiet{display:flex;gap:10px;align-items:center;margin-top:18px;color:var(--ink2);font-size:13px;font-weight:500;padding-left:6px}

/* book tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.tile{background:var(--card);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--sh);min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font:800 28px/1 var(--font);letter-spacing:-.03em}
.tile span{font-size:12.5px;color:var(--mute);font-weight:600}
.tile.blk{background:var(--ink);color:#fff}.tile.blk span{color:#9aa0ae}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(200px,1.1fr) minmax(0,1.5fr) auto;gap:20px;align-items:center;background:var(--card);border-radius:var(--r-md);padding:14px 20px;box-shadow:var(--sh)}
.row .t{font-weight:700;font-size:15px;line-height:1.35}
.row .t small{display:block;font-weight:500;font-size:12.5px;color:var(--mute);margin-top:2px}
.row .v{font:800 19px var(--font);letter-spacing:-.02em;text-align:right;white-space:nowrap}
.rows.soft .row{box-shadow:none;background:rgba(255,255,255,.6)}.rows.soft .v{color:var(--ink2)}
.grp{display:flex;justify-content:space-between;align-items:baseline;margin:24px 4px 10px;font-weight:700;font-size:14px}
.grp span{color:var(--mute);font-weight:500;font-size:12.5px}
.apart{border:2px dashed #e2c98a;border-radius:var(--r-xl);padding:8px 20px 20px;margin-top:26px;background:rgba(251,239,210,.35)}
.tg{display:inline-block;font:700 10.5px var(--font);letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-bottom:5px}
.tg.claim{background:var(--amber-bg);color:var(--amber)}.tg.offer{background:var(--blue-bg);color:var(--blue)}.tg.unpriced{background:#e8e9ee;color:var(--ink2)}

/* receipts */
.rc{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 11.5px var(--mono);color:var(--ink2);background:#f1f2f6;border:0;border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover,.chip.sel{background:var(--ink);color:#fff}
.chip i{width:7px;height:7px;border-radius:50%;flex:none;background:#b8bcc7}
.chip i.v{background:var(--green)}.chip i.t{background:var(--blue)}.chip i.c{background:#e0a526}
.nosrc{font-size:12px;color:var(--red);font-weight:600}

/* power */
.deal{margin-top:14px;display:grid;grid-template-columns:minmax(220px,.9fr) 1.7fr;gap:16px}
.deal:first-of-type{margin-top:0}
.deal .who{display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.deal h3{font:700 18px/1.3 var(--font);letter-spacing:-.01em;margin:0 0 4px}
.people{display:flex;flex-direction:column;gap:10px}
.person{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--font);flex:none;position:relative;background:#e8ebf2;color:var(--ink)}
.ava::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--card);background:#c4c8d2}
.ava.ally::after{background:var(--green)}.ava.warm::after{background:#8ccaa6}.ava.neutral::after{background:var(--blue)}.ava.guarded::after{background:var(--red)}
.person small{display:block;color:var(--mute);font-weight:500;font-size:11.5px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role{background:var(--panel);border-radius:var(--r-md);padding:14px 16px}
.role.first{background:var(--ink);color:#fff}.role.first .lab{color:#9aa0ae}
.role p{margin:5px 0 0;font-size:13.5px;line-height:1.45;font-weight:500}

/* flow (moves) */
.flow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(290px,1fr);gap:46px;overflow-x:auto;padding:4px 4px 14px}
.step{background:var(--card);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--sh);position:relative;display:flex;flex-direction:column;gap:12px}
.step::after{content:"";position:absolute;top:44px;right:-46px;width:46px;border-top:2px solid #cfd3dc}
.step::before{content:"";position:absolute;top:40px;right:-48px;width:8px;height:8px;border-radius:50%;background:#cfd3dc}
.step:last-child::after,.step:last-child::before{display:none}
.step.first{background:var(--ink);color:#fff}
.step .no{width:40px;height:40px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font:800 16px var(--font);color:var(--ink)}
.step.first .no{background:#fff}
.step h3{font:700 17px/1.4 var(--font);letter-spacing:-.01em;margin:0}
.step .why{font-size:13.5px;color:var(--ink2);margin:0;font-weight:500}
.step.first .why{color:#c3c7d2}
.step .chip{background:var(--panel)}.step.first .chip{background:rgba(255,255,255,.14);color:#fff}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.mp{background:var(--panel);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600}
.step.first .mp{background:rgba(255,255,255,.14)}
.mp.soon{background:var(--red-bg);color:var(--red)}.step.first .mp.soon{background:var(--red);color:#fff}
.mp small{color:var(--mute);font-weight:600;margin-right:5px;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.step.first .mp small{color:#b3b8c4}

/* table style rows (risks, unknowns) */
.tbl{display:grid;gap:8px}
.tr{display:grid;gap:18px;align-items:center;background:var(--card);border-radius:var(--r-md);padding:14px 20px;box-shadow:var(--sh)}
.tr.risk{grid-template-columns:96px minmax(0,1.6fr) minmax(0,1fr)}
.tr.gap{grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,1fr)}
.th{display:grid;gap:18px;padding:0 20px 2px;font:600 11px var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.th.risk{grid-template-columns:96px minmax(0,1.6fr) minmax(0,1fr)}.th.gap{grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,1fr)}
.sev{display:inline-block;text-align:center;font:700 11px var(--font);letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:6px 12px}
.sev.high{background:var(--red-bg);color:var(--red)}.sev.med{background:var(--amber-bg);color:var(--amber)}.sev.low{background:var(--green-bg);color:var(--green)}
.tr h4{margin:0 0 6px;font:700 15px/1.4 var(--font);letter-spacing:-.005em}
.tr .w{font-size:13.5px;color:var(--ink2);font-weight:500}
.tr.gap .g{font-weight:700;font-size:14.5px;line-height:1.4}

/* notes */
.nf{display:grid;grid-template-columns:200px 150px 1fr auto;gap:12px;align-items:end}
.fl span{display:block;margin-bottom:6px}
select,input{font:500 14.5px var(--font);width:100%;border:0;background:var(--card);border-radius:16px;padding:13px 16px;color:var(--ink);box-shadow:var(--sh)}
input:focus,select:focus{outline:2px solid var(--ink)}
.go{width:52px;height:52px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:24px;cursor:pointer;display:grid;place-items:center}
.go:hover{background:#2b2e36}.go:disabled{opacity:.5}
#nm{margin-top:10px;font-size:13.5px;color:var(--ink2);min-height:20px;font-weight:500}
.saved{display:grid;gap:8px;margin-top:10px}
.saved .card{padding:12px 18px;font-size:14px;border-radius:var(--r-md);font-weight:500}.saved small{display:block;color:var(--mute);font-weight:600;font-size:11.5px;margin-bottom:2px}

footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:26px;padding:0 8px;color:var(--mute);font-size:12.5px;font-weight:500}

/* receipt drawer */
#drawer{position:fixed;right:30px;bottom:30px;width:400px;max-width:calc(100vw - 40px);background:var(--card);border-radius:var(--r-xl);box-shadow:0 30px 80px -20px rgba(20,24,40,.45);padding:26px 26px 24px;z-index:40;transform:translateY(20px);opacity:0;pointer-events:none;transition:all .22s ease}
#drawer.open{transform:none;opacity:1;pointer-events:auto}
#drawer .x{position:absolute;top:14px;right:16px;width:34px;height:34px;border-radius:50%;border:0;background:var(--panel);cursor:pointer;font-size:18px;line-height:1}
#drawer .id{font:500 12.5px var(--mono);color:var(--ink2);background:var(--panel);display:inline-block;border-radius:999px;padding:4px 12px;margin:8px 0 14px;word-break:break-all}
#drawer blockquote{margin:0;font:600 18px/1.45 var(--font);letter-spacing:-.01em}
#drawer .st{margin-top:18px;font-size:13.5px;color:var(--ink2);font-weight:500}
#drawer .st b{display:inline-block;font:700 10.5px var(--font);letter-spacing:.08em;text-transform:uppercase;padding:4px 11px;border-radius:999px;margin-bottom:8px}
.st b.v{background:var(--green-bg);color:var(--green)}.st b.t{background:var(--blue-bg);color:var(--blue)}.st b.c{background:var(--amber-bg);color:var(--amber)}.st b.o{background:var(--panel);color:var(--ink2)}

.loading{padding:110px 0;text-align:center;color:var(--ink2);font-weight:600;font-size:18px}


/* brand + overview */
.brand{display:flex;align-items:center;gap:9px;font:500 22px var(--font);letter-spacing:-.03em;margin-right:8px}.brand b{font-weight:800}
.pbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px;justify-content:space-between}
.pbar h2::before{display:none}
.seg{display:flex;gap:6px;background:rgba(255,255,255,.55);padding:6px;border-radius:999px;margin:0 auto}
.seg button{border:0;background:rgba(255,255,255,.8);font-weight:600;font-size:13px;padding:9px 18px;border-radius:999px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.cap2{font-size:12.5px;color:var(--mute);font-weight:600}
.kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.kh{border:1.5px solid rgba(13,14,17,.13);border-radius:999px;text-align:center;padding:9px;font-weight:600;font-size:13.5px;background:rgba(255,255,255,.55)}
.kh span{color:var(--mute);font-weight:700;margin-left:4px}
.kcol{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.kc{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.9);border:0;border-radius:32px;padding:10px 16px 10px 10px;box-shadow:var(--sh);position:relative;text-align:left;cursor:pointer;font:inherit;color:var(--ink);transition:transform .18s,box-shadow .18s}
.kc:hover{transform:translateY(-2px);box-shadow:0 16px 30px -14px rgba(20,24,40,.3)}
.kc+.kc::before{content:"";position:absolute;top:-12px;left:50%;width:7px;height:7px;margin-left:-3px;border-radius:50%;background:#c9d1e3;border:2px solid #eef1f9}
.kc .ava{width:46px;height:46px;flex:none}
.kc b{display:block;font-size:14px;line-height:1.25;letter-spacing:-.01em}
.kc small{display:block;color:var(--mute);font-size:11.5px;font-weight:500;margin-top:2px}
.kc .ic{margin-left:auto;color:var(--ink2);flex:none;display:grid}
.kempty{color:var(--mute);font-size:13px;text-align:center;padding:16px 0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.donut{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.donut svg{width:170px;flex:none}.donut .dn{font:800 16px var(--font);fill:var(--ink)}.donut .ds{font:600 9px var(--font);fill:var(--mute)}
.leg2{display:grid;gap:12px;font-size:13.5px;font-weight:600}.leg2 i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}.leg2 small{display:block;color:var(--mute);font-weight:500;margin-left:18px}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.ringw svg{width:100%;max-width:130px}.ringw text{font:800 20px var(--font);fill:var(--ink)}.ringw b{display:block;font-size:13px;margin-top:4px}.ringw small{color:var(--mute);font-weight:500;font-size:11.5px}
@media (max-width:1100px){.kb{grid-template-columns:1fr 1fr}.duo{grid-template-columns:1fr}.brand span{display:none}}
@media (max-width:640px){.kb{grid-template-columns:1fr}.rings{grid-template-columns:1fr}}
/* polish */
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.panel,.brief,.events,.tl{animation:up .55s cubic-bezier(.2,.7,.2,1) both}
.panel:nth-of-type(2){animation-delay:.05s}.panel:nth-of-type(3){animation-delay:.1s}
.row,.step,.deal,.tr,.tile{transition:transform .18s ease,box-shadow .18s ease}
.row:hover,.tr:hover,.tile:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px rgba(20,24,40,.25)}
.step:hover,.deal:hover{box-shadow:0 18px 36px -16px rgba(20,24,40,.28)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:10px}
.tr h4+.w{font-weight:500;color:var(--mute);font-size:13px}

/* composition bar */
.comp{margin:4px 0 8px;background:var(--card);border-radius:var(--r-lg);padding:16px 20px;box-shadow:var(--sh)}
.bar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--panel);gap:3px;margin:10px 0 12px}
.bar i{display:block;min-width:6px;border-radius:999px}
.leg{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.leg span{display:inline-flex;align-items:center;gap:7px}.leg b{color:var(--ink);font-weight:800}.leg em{width:10px;height:10px;border-radius:50%;display:inline-block}

/* 90-day timeline */
.tl{background:var(--card);border-radius:var(--r-xl);padding:20px 26px 16px;margin-top:18px;box-shadow:var(--sh)}
.tl .lab{margin-bottom:4px}
.track{position:relative;height:118px;margin:6px 14px 0}
.track::before{content:"";position:absolute;left:0;right:0;top:57px;border-top:2px solid var(--line)}
.pt{position:absolute;top:50px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#c4c8d2;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.pt.m1{background:var(--ink)}.pt.deadline{background:var(--red)}.pt.today{background:var(--green);box-shadow:0 0 0 5px var(--green-bg)}
.pl{position:absolute;font-size:12.5px;font-weight:700;line-height:1.25;white-space:nowrap;transform:translateX(-50%)}
.pl small{display:block;font-weight:500;color:var(--mute)}
.pl.up{top:6px}.pl.dn{top:78px}

/* usage chart */
.chart{background:var(--card);border-radius:var(--r-lg);padding:18px 22px 12px;box-shadow:var(--sh);margin-bottom:16px}
.chart .hd{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline}
.chart h3{margin:0;font:800 17px var(--font);letter-spacing:-.02em}
.chart .hd span{font-size:12.5px;color:var(--ink2);font-weight:600}
.chart svg{width:100%;height:auto;margin-top:8px;display:block}
.chart text{font:600 8px var(--font);fill:var(--mute)}
@media (max-width:1100px){
  .tiles{grid-template-columns:1fr 1fr}.brief{grid-template-columns:1fr}.deal{grid-template-columns:1fr}
  .row{grid-template-columns:1fr auto}.row .rc{grid-column:1/-1;order:3}
  .tr.risk,.th.risk{grid-template-columns:90px 1fr}.tr.risk .w{grid-column:2}.th{display:none}
  .tr.gap{grid-template-columns:1fr}
}
@media (max-width:820px){
  body{padding:0}.shell{border-radius:0;grid-template-columns:1fr;min-height:100vh}
  .rail{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);height:auto;flex-direction:row;padding:8px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-radius:999px;box-shadow:0 14px 40px -10px rgba(20,24,40,.4);z-index:30;top:auto;gap:4px}
  .rail .logo,.rail .sp,.rail .tip{display:none}.rb{width:42px;height:42px;box-shadow:none;background:transparent}.rb.on{background:var(--ink)}
  .main{padding:16px 16px 100px}.pills{display:none}.head h1{font-size:30px}
  .nf{grid-template-columns:1fr 1fr}.nf .fl.wide{grid-column:1/-1}.go{justify-self:end}
  .roles{grid-template-columns:1fr}.panel{padding:20px 16px;border-radius:28px}
  #drawer{right:12px;bottom:84px}
}
@media print{body{background:#fff;padding:0}.shell{box-shadow:none;display:block}.rail,.tools,.pills,.nf,#drawer{display:none}.panel{break-inside:avoid}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>

<body>

  <nav class="rail" id="rail" aria-label="Sections">
    <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0d0e11" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg></div>
    <a class="rb" href="#overview" data-s="overview"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span class="tip">Overview</span></a>
    <a class="rb" href="#q1" data-s="q1"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8 9h8M8 13h8M8 17h4"/></svg><span class="tip">Book</span></a>

    <a class="rb" href="#q3" data-s="q3"><svg viewBox="0 0 24 24"><circle cx="5.500" cy="12" r="2"/><circle cx="18.500" cy="6" r="2"/><circle cx="18.500" cy="18" r="2"/><path d="M7.500 12h4c2 0 2-6 5-6M11.500 12c3 0 3 6 5 6"/></svg><span class="tip">First moves</span></a>
    <a class="rb" href="#q4" data-s="q4"><svg viewBox="0 0 24 24"><path d="M12 4 2.800 19.500h18.400L12 4Z"/><path d="M12 10v4.500M12 17.200v.1"/></svg><span class="tip">Risks</span></a>
    <a class="rb" href="#q5" data-s="q5"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.500 9.500a2.500 2.500 0 1 1 3.600 2.200c-.7.400-1.100.9-1.100 1.800M12 17v.1"/></svg><span class="tip">Unknowns</span></a>
    <a class="rb" href="#notes" data-s="notes"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.800 2.800 0 0 0-4-4L4 16v4Z"/></svg><span class="tip">Write back</span></a>
    <div class="sp"></div>
    <button class="rb dot" id="railstat" type="button" aria-label="Live status"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 0 1 14 0M8 12a4 4 0 0 1 8 0"/><circle cx="12" cy="15" r="1.2"/></svg><span class="tip" id="railtip">Live</span></button>
  </nav>

  <div class="main">
    <header class="top">
      <div class="brand"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0d0e11" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg><span>account<b>review</b></span></div>
      <div class="pills" id="pills">
        <a class="pill" href="#overview" data-s="overview">Overview</a><a class="pill" href="#q1" data-s="q1">Book</a><a class="pill" href="#q2" data-s="q2">Power</a><a class="pill" href="#q3" data-s="q3">First moves</a><a class="pill" href="#q4" data-s="q4">Risks</a><a class="pill" href="#q5" data-s="q5">Unknowns</a><a class="pill" href="#notes" data-s="notes">Write back</a>
      </div>
      <div class="tools"><span class="status" id="status"><i></i>Loading</span>
        <button class="ib" id="refresh" type="button" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.300 6.300M20 4v7h-7"/></svg></button></div>

<aside id="drawer" aria-live="polite" aria-label="Receipt"><button class="x" type="button" id="dx" aria-label="Close">×</button>
  <div class="lab" id="dk"></div><div class="id" id="di"></div><blockquote id="dl"></blockquote><div class="st" id="ds"></div></aside>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let data,cur=0;
const KIND={fact:"Fact on file",deal:"Deal",person:"Person",file:"Data room file",record:"Paperwork record",signal:"Live event"};
const mark=r=>!r?"o":r.kind==="fact"?(r.status==="verified"?"v":r.status==="claim"?"c":"t"):"o";
const receipts=(ids,R)=>(!ids||!ids.length)?'<div class="rc"><span class="nosrc">no source</span></div>':'<div class="rc">'+ids.map(id=>{const r=R[id];return `<button type="button" class="chip" data-id="${esc(id)}" title="${esc(r?.label||id)}"><i class="${mark(r)}"></i>${esc(id)}</button>`}).join("")+"</div>";
const dueDays=d=>Math.round((new Date(d+"T12:00:00")-new Date())/864e5);
const dShort=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}catch{return d}};
const dLong=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}catch{return d}};
const rel=n=>n<0?`${-n}d overdue`:n===0?"today":n===1?"tomorrow":`in ${n} days`;
const hue=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
const initials=n=>n.replace(/^(Insp\.|Dr\.?|Mr\.?|Ms\.?)\s*/i,"").split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const short=n=>n.name.includes("Eastern")?"EC":"AI";

const money=(n,c)=>c+Math.round(n).toLocaleString("en-GB");
function compBar(a){
  const k=a.kpis,tot=k.bookedN+k.ceilingN+k.offersN||1;
  const seg=[["Booked and backed",k.bookedN,"#0d0e11"],["Pipeline ceilings (not counted)",k.ceilingN,"#8aa6e8"],["Open offers (not accepted)",k.offersN,"#d9dce4"]].filter(s=>s[1]>0);
  return `<div class="comp"><div class="lab">How the book splits</div><div class="bar">${seg.map(s=>`<i style="width:${(s[1]/tot*100).toFixed(1)}%;background:${s[2]}" title="${esc(s[0])}"></i>`).join("")}</div><div class="leg">${seg.map(s=>`<span><em style="background:${s[2]}"></em>${esc(s[0])} <b class="num">${money(s[1],k.currency)}</b></span>`).join("")}</div></div>`;
}
function timeline(a){
  const t0=new Date();t0.setHours(12,0,0,0);
  const items=(a.timeline||[]).map(x=>({...x,d:new Date(x.date+"T12:00:00")})).filter(x=>x.d>=t0).sort((p,q)=>p.d-q.d);
  if(!items.length)return"";
  const span=Math.max(...items.map(x=>x.d-t0),864e5*30)*1.04;
  const pos=d=>Math.min(97,Math.max(3,(d-t0)/span*100));
  return `<div class="tl"><div class="lab">The next ${Math.ceil(span/864e5)} days</div><div class="track"><div class="pt today" style="left:3%"></div><div class="pl dn" style="left:3%">Today<small>${esc(t0.toLocaleDateString("en-GB",{day:"numeric",month:"short"}))}</small></div>${items.map((x,i)=>`<div class="pt ${x.kind==="deadline"?"deadline":x.label==="Move 1"?"m1":""}" style="left:${pos(x.d)}%"></div><div class="pl ${i%2?"dn":"up"}" style="left:${pos(x.d)}%">${esc(x.label)}<small>${esc(dShort(x.date))}</small></div>`).join("")}</div></div>`;
}
function usageChart(a){
  const s=a.usage?.series||[];if(s.length<4)return"";
  const W=640,H=130,bw=W/s.length,max=Math.max(...s.map(x=>x.flights),1);
  const last4=s.slice(-4).reduce((n,x)=>n+x.flights,0),prev4=s.slice(-8,-4).reduce((n,x)=>n+x.flights,0);
  const bars=s.map((x,i)=>{const hh=Math.max(2,x.flights/max*(H-26));const recent=i>=s.length-4;return `<rect x="${(i*bw+2).toFixed(1)}" y="${(H-14-hh).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${hh.toFixed(1)}" rx="3" fill="${recent?"#0d0e11":"#cfd3dc"}"><title>${esc(x.w)}: ${x.flights} flights, ${x.docks} docks flew</title></rect>`}).join("");
  const lbl=[0,Math.floor(s.length/2),s.length-1].map(i=>`<text x="${(i*bw+bw/2).toFixed(1)}" y="${H}" text-anchor="${i===0?"start":i===s.length-1?"end":"middle"}">${esc(dShort(s[i].w))}</text>`).join("");
  const delta=prev4?Math.round((last4-prev4)/prev4*100):0;
  return `<div class="chart"><div class="hd"><h3>Flights per week</h3><span>${a.usage.flyingNow} of ${a.usage.docks} docks flew in the last 4 weeks · ${last4} flights vs ${prev4} in the 4 before (${delta>0?"+":""}${delta}%)</span></div><svg viewBox="0 0 ${W} ${H+2}" role="img" aria-label="Flights per week">${bars}${lbl}</svg></div>`;
}
let flt="all";
const ICON={check:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 12.5 4.5 4.5L14 8.5M10 16.5l.5.5L21 7"/></svg>',clock:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',dots:'<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',plus:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg>'};
function pipelinePanel(a){
  const k=a.kpis,cs=k.currency,P=a.pipeline||[];
  const cols=[["identified","Identified"],["qualified","Qualified"],["agreed","Agreed and won"],["offer","Open offers"]];
  const keep=p=>flt==="all"||(flt==="blocked"&&p.blocker==="open")||(flt==="booked"&&p.col==="agreed")||(flt==="notcounted"&&p.col!=="agreed");
  const sub=p=>p.col==="agreed"?`${money(p.amount||0,cs)} booked`:p.col==="qualified"?`up to ${money(p.amount||0,cs)} · blocker ${p.blocker||"none"}`:p.col==="offer"?`${money(p.amount||0,cs)} offer · not accepted`:p.amount?`up to ${money(p.amount,cs)}`:"no value on file";
  const ic=p=>p.col==="agreed"?ICON.check:p.col==="qualified"?ICON.clock:p.col==="offer"?ICON.plus:ICON.dots;
  const tabs=[["all","All deals"],["blocked","Blocked"],["booked","Booked"],["notcounted","Not counted"]];
  return `<section class="panel glass" id="overview"><div class="pbar"><h2 style="margin:0">Deal pipeline</h2><div class="seg" role="tablist">${tabs.map(t=>`<button type="button" class="${flt===t[0]?"on":""}" data-flt="${t[0]}">${t[1]}</button>`).join("")}</div><button class="ib" type="button" onclick="window.print()" aria-label="Print"><svg viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v6H7z"/></svg></button></div>
    <div class="kb">${cols.map(([c,t])=>{const items=P.filter(p=>p.col===c&&keep(p));return `<div><div class="kh">${t} <span>${items.length}</span></div><div class="kcol">${items.map(p=>`<button type="button" class="kc" data-id="${esc(p.id)}"><span class="ava ${p.col==="agreed"?"ally":""}" style="background:hsl(${hue(p.person||p.title)} 65% 90%);color:hsl(${hue(p.person||p.title)} 45% 28%)">${esc(initials(p.person||p.title))}</span><span><b>${esc(p.title)}</b><small>${esc(sub(p))}</small></span><span class="ic">${ic(p)}</span></button>`).join("")||'<div class="kempty">Nothing here</div>'}</div></div>`}).join("")}</div></section>`;
}
function ring(pct,label,cap,col){const r=44,c=2*Math.PI*r,d=c*Math.max(0,Math.min(1,pct));return `<div class="ringw"><svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="${r}" fill="none" stroke="#e1e6f1" stroke-width="10"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${d.toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 55 55)"/><text x="55" y="61" text-anchor="middle">${Math.round(pct*100)}%</text></svg><b>${esc(label)}</b><small>${esc(cap)}</small></div>`}
function driversMetrics(a){
  const k=a.kpis,cs=k.currency,tot=k.bookedN+k.ceilingN+k.offersN||1,m=a.metrics||{};
  const seg=[["Booked and backed",k.bookedN,"#5b8def"],["Pipeline ceilings",k.ceilingN,"#e2564f"],["Open offers",k.offersN,"#c7cfdd"]].filter(s=>s[1]>0);
  const R=52,C=2*Math.PI*R;let off=0;
  const arcs=seg.map(s=>{const len=s[1]/tot*C;const el=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${s[2]}" stroke-width="26" stroke-dasharray="${(len-2).toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 70 70)"/>`;off+=len;return el}).join("");
  return `<div class="duo"><section class="panel glass"><div class="pbar"><h2 style="margin:0">Where the value sits</h2><span class="cap2">${esc(cs)} by status</span></div><div class="donut"><svg viewBox="0 0 140 140" role="img" aria-label="Book split">${arcs}<text x="70" y="66" text-anchor="middle" class="dn">${esc(k.backed)}</text><text x="70" y="82" text-anchor="middle" class="ds">backed</text></svg><div class="leg2">${seg.map(s=>`<div><i style="background:${s[2]}"></i>${esc(s[0])} <b>(${Math.round(s[1]/tot*100)}%)</b><small>${money(s[1],cs)}</small></div>`).join("")}</div></div></section>
  <section class="panel glass"><div class="pbar"><h2 style="margin:0">Health metrics</h2><span class="cap2">from the data on file</span></div><div class="rings">${ring((m.verified||0)/Math.max(m.facts||1,1),"Facts verified",`${m.verified||0} of ${m.facts||0} facts`,"#5b8def")}${ring((m.agreed||0)/Math.max(m.opps||1,1),"Deals agreed",`${m.agreed||0} of ${m.opps||0} deals`,"#f2cf4d")}${ring((a.usage?.flyingNow||0)/Math.max(a.usage?.docks||1,1),"Docks flying",`${a.usage?.flyingNow||0} of ${a.usage?.docks||0}, last 4 weeks`,"#8fa0b3")}</div></section></div>`;
}
function overview(a){return pipelinePanel(a)+driversMetrics(a)}

function render(){
  if(!data||!data.accounts){$("#view").innerHTML=`<div class="loading">Still reading the files (${esc((data?.fetched||[]).length)} of 10)…</div>`;return}
  const st=data.status||{};
  const live=st.mode==="live";
  $("#status").innerHTML=live?`<i class="on"></i>Live · checked ${new Date(st.liveAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}`:`<i class="warn"></i>${st.mode==="connecting"?"Connecting to live feed":"Snapshot"}`;
  $("#railstat").classList.toggle("warn",!live);$("#railtip").textContent=live?"Live feed on":"Snapshot";
  const a=data.accounts[cur],R=a.refs||{},k=a.kpis||{};
  const sigs=data.live?.signals||[];
  const booked=a.q1.backed.filter(r=>r.kind==="booked"),ceil=a.q1.backed.filter(r=>r.kind==="ceiling"),ben=a.q1.backed.filter(r=>r.kind==="benefit");
  const m0=a.q3[0];

  const events=sigs.length?`<div class="events"><div class="lab" style="color:var(--red)">New since the data was pulled · ${sigs.length}</div>${sigs.map(s=>`<div class="ev"><b>${esc(s.title)}</b> ${s.account?`<span class="tg offer">Account ${esc(s.account)}</span>`:""}<div class="lab" style="margin:3px 0 5px">${esc(s.date)}</div><div>${esc(s.detail)}</div></div>`).join("")}<div style="margin-top:10px;font-size:13px;font-weight:600">Already reflected in sections 3 to 5.</div></div>`
    :`<div class="quiet"><i class="status" style="padding:0;box-shadow:none;background:none"><i class="on"></i></i>No live events yet. New ones appear here, and flow into sections 3 to 5, as they arrive.</div>`;

  $("#view").innerHTML=`
  <div class="head"><div><h1>Accounts Overview</h1><div class="sub"><b style="color:var(--ink)">${esc(a.name)}</b> · Account ${esc(a.id)} · ${new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})} · Monday briefing</div></div>
    <div class="avs">${data.accounts.map((x,i)=>`<button class="av ${i===cur?"on":""}" data-tab="${i}" title="${esc(x.name)}" aria-label="${esc(x.name)}">${short(x)}${x.kpis.high?`<span class="bd">${x.kpis.high}</span>`:""}</button>`).join("")}<small>high risks</small></div></div>

  <div class="brief" style="margin-top:22px"><div class="card"><div class="lab">The short version</div>
    <p><em>${esc(k.backed)}</em> is on the books and backed by a signed order or a won offer, with a further ${esc(k.ceiling)} of pipeline not yet counted. ${k.claims?`<em class="bad">${k.claims} customer claim${k.claims>1?"s":""}</em> set apart because nothing backs ${k.claims>1?"them":"it"}.`:""} ${k.high?`${k.high} risk${k.high>1?"s are":" is"} high.`:""}</p></div>
    <div class="next"><div class="lab">Do this first</div><h3>${esc(m0.move)}</h3><div class="nrow"><span class="tg">${esc(dLong(m0.due))}</span><span class="tg">${esc(rel(dueDays(m0.due)))}</span></div></div></div>
  ${events}${overview(a)}${timeline(a)}

  <section class="panel" id="q1"><h2 data-n="1">What is the book worth?</h2><div class="cap">Each deal at a value we can back, with the file or person behind it. What we cannot back is set apart and never added in.</div>
    <div class="tiles"><div class="tile blk"><span>Backed total</span><b class="num">${esc(k.backed)}</b></div><div class="tile"><span>Pipeline ceilings, not counted</span><b class="num">${esc(k.ceiling)}</b></div><div class="tile"><span>Claims set apart</span><b class="num">${k.claims}</b></div><div class="tile"><span>High-severity risks</span><b class="num" style="color:${k.high?"var(--red)":"inherit"}">${k.high}</b></div></div>
    <div class="grp">Booked and backed <span>counts toward the total</span></div>
    <div class="rows">${booked.map(r=>`<div class="row"><div class="t">${esc(r.deal)}<small>${esc(r.basis||"")}</small></div>${receipts(r.sources,R)}<div class="v num">${esc(r.value)}</div></div>`).join("")}</div>
    ${ceil.length?`<div class="grp">Pipeline ceilings <span>not counted: blockers still open</span></div><div class="rows soft">${ceil.map(r=>`<div class="row"><div class="t">${esc(r.deal)}<small>${esc(r.basis||"")}</small></div>${receipts(r.sources,R)}<div class="v num">${esc(r.value)}</div></div>`).join("")}</div>`:""}
    ${ben.length?`<div class="grp">Customer benefit <span>verified, but not FlytBase revenue</span></div><div class="rows soft">${ben.map(r=>`<div class="row"><div class="t">${esc(r.deal)}<small>${esc(r.basis||"")}</small></div>${receipts(r.sources,R)}<div class="v num">${esc(r.value)}</div></div>`).join("")}</div>`:""}
    <div class="apart"><div class="grp" style="margin-top:20px">Set apart: not backed <span>never added to a total</span></div>
      <div class="rows">${a.q1.unbacked.map(r=>`<div class="row"><div class="t"><span class="tg ${r.kind}">${r.kind==="claim"?"Claim":r.kind==="offer"?"Open offer":"Unpriced"}</span><br>${esc(r.deal)}<small>${r.said_by?"Said by "+esc(r.said_by)+". ":""}${esc(r.why)}</small></div>${receipts(r.sources,R)}<div class="v num" style="color:var(--ink2)">${esc(r.value.replace("claimed, not backed","unbacked"))}</div></div>`).join("")}</div></div>
  </section>

  <section class="panel" id="q2"><h2 data-n="2">Who holds the power?</h2><div class="cap">For each deal: who decides, who pays, who uses it, who could block it, and where each person stands with us.</div>
    ${a.q2.map(r=>`<div class="card deal"><div class="who"><div><h3>${esc(r.deal)}</h3>${receipts(r.sources,R)}</div>
      <div class="people">${String(r.standing).split("; ").map(p=>{const m=p.match(/^(.*): (\w+)$/);return m?`<div class="person"><span class="ava ${m[2]}" style="background:hsl(${hue(m[1])} 65% 90%);color:hsl(${hue(m[1])} 45% 28%)">${esc(initials(m[1]))}</span><div>${esc(m[1])}<small>${esc(m[2])} with us</small></div></div>`:`<div class="person"><small>${esc(p)}</small></div>`}).join("")}</div></div>
      <div class="roles"><div class="role first"><div class="lab">Decides</div><p>${esc(r.decides)}</p></div><div class="role"><div class="lab">Pays</div><p>${esc(r.pays)}</p></div><div class="role"><div class="lab">Uses it</div><p>${esc(r.uses)}</p></div><div class="role"><div class="lab">Could block</div><p>${esc(r.blocks)}</p></div></div></div>`).join("")}
  </section>

  <section class="panel" id="q3"><h2 data-n="3">What do we do first?</h2><div class="cap">The first moves, ranked, each with one owner, a date and the deal it moves.</div>
    <div class="flow">${a.q3.map((m,i)=>{const d=dueDays(m.due);return `<div class="step ${i===0?"first":""}"><div class="no">${m.rank}</div><h3>${esc(m.move)}</h3><p class="why">${esc(m.why)}</p>${receipts(m.sources,R)}
      <div class="meta"><span class="mp"><small>Owner</small>${esc(m.owner)}</span><span class="mp ${d<=10?"soon":""}"><small>By</small>${esc(dShort(m.due))} · ${esc(rel(d))}</span><span class="mp"><small>Moves</small>${esc(m.deal)}</span></div></div>`}).join("")}</div>
  </section>

  <section class="panel" id="q4"><h2 data-n="4">What is about to go wrong?</h2><div class="cap">Deadlines at risk, requests going cold, deals that are stuck, and when each turns bad. Worst first.</div>
    ${usageChart(a)}<div class="th risk"><span>Status</span><span>What</span><span>Turns bad</span></div>
    <div class="tbl">${a.q4.map(r=>`<div class="tr risk"><div><span class="sev ${esc(r.sev)}">${esc(r.sev==="med"?"Watch":r.sev)}</span></div><div><h4>${esc(r.risk)}</h4>${r.detail?`<div class="w" style="margin:-2px 0 8px">${esc(r.detail)}</div>`:""}${receipts(r.sources,R)}</div><div class="w">${esc(r.when)}</div></div>`).join("")}</div>
  </section>

  <section class="panel" id="q5"><h2 data-n="5">What do we still not know?</h2><div class="cap">The gaps this plan rests on, why each one matters, and who could close it.</div>
    <div class="th gap"><span>Gap</span><span>Why it matters</span><span>Who could tell us</span></div>
    <div class="tbl">${a.q5.map(r=>`<div class="tr gap"><div class="g">${esc(r.gap)}</div><div class="w">${esc(r.why)}</div><div class="w" style="color:var(--ink);font-weight:600">${esc(r.who)}</div></div>`).join("")}</div>
  </section>

  <section class="panel" id="notes"><h2 data-n="✎">Write it back</h2><div class="cap">Saved to the game with write_note, so this plan and the system of record stay in step.</div>
    <form class="nf" id="nf"><label class="fl"><span class="lab">Account</span><select id="na">${data.accounts.map(x=>`<option value="${esc(x.id)}" ${x.id===a.id?"selected":""}>${esc(x.id)} · ${esc(x.name.split(" ").slice(0,2).join(" "))}</option>`).join("")}</select></label>
      <label class="fl"><span class="lab">Type</span><select id="nk"><option value="next_step">Next step</option><option value="risk">Risk</option><option value="task">Task</option><option value="note">Note</option></select></label>
      <label class="fl wide"><span class="lab">Note</span><input id="nt" maxlength="500" placeholder="What should be done or remembered?" autocomplete="off"></label><button class="go" id="ng" aria-label="Save note">+</button></form><div id="nm" role="status"></div>
    <div class="saved">${(data.notes||[]).slice(-5).reverse().map(n=>`<div class="card"><small>${esc(n.kind||"note")} · ${esc(n.account||"")} ${esc(n.created_at||n.at||"")}</small>${esc(n.text||n.title||"")}</div>`).join("")}</div>
  </section>
  <footer><span>Data pulled ${st.dataAsOf?esc(new Date(st.dataAsOf).toLocaleString("en-GB",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})):"at build time"}. Built from the account export and paperwork on file.</span><span>Click any id to read the fact behind it.</span></footer>`;
  bind();spy();
}

function showReceipt(id){
  const r=data.accounts[cur].refs[id]||{},m=mark(r);
  $("#dk").textContent=KIND[r.kind]||"Source";$("#di").textContent=id;$("#dl").textContent=r.label||"On file";
  const why={v:["Verified","Checked against a file or record on the account."],t:["Told","Said to us in conversation. Not independently checked."],c:["Claim","A statement nobody has backed. Shown, but never counted."],o:[KIND[r.kind]||"Source",""]}[m];
  $("#ds").innerHTML=`<b class="${m}">${esc(why[0])}</b><div>${esc(r.meta||"")}</div><div style="margin-top:6px">${esc(why[1])}</div>`;
  $("#drawer").classList.add("open");
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("sel",c.dataset.id===id));
}
function bind(){
  const nf=$("#nf");if(nf)nf.onsubmit=async e=>{e.preventDefault();const text=$("#nt").value.trim();if(!text)return;$("#ng").disabled=true;$("#nm").textContent="Saving…";
    try{const r=await fetch("/api/note",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text,account:$("#na").value,kind:$("#nk").value})});
      const j=await r.json();$("#nm").textContent=r.ok?"Saved to the game.":(j.error||"Could not save.");if(r.ok)$("#nt").value=""}catch(err){$("#nm").textContent="Could not save: "+err.message}$("#ng").disabled=false};
}
let io;function spy(){io&&io.disconnect();io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll("[data-s]").forEach(a=>a.classList.toggle("on",a.dataset.s===e.target.id))})},{rootMargin:"-25% 0px -65% 0px"});document.querySelectorAll("section.panel[id]").forEach(s=>io.observe(s))}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip");if(c){showReceipt(c.dataset.id);return}
  const fl=e.target.closest("[data-flt]");if(fl){flt=fl.dataset.flt;render();return}
  const kc=e.target.closest(".kc");if(kc){showReceipt(kc.dataset.id);return}
  const t=e.target.closest("[data-tab]");if(t){cur=+t.dataset.tab;render();return}
  if(!e.target.closest("#drawer")){$("#drawer").classList.remove("open");document.querySelectorAll(".chip.sel").forEach(x=>x.classList.remove("sel"))}
});
$("#dx").onclick=()=>$("#drawer").classList.remove("open");
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#drawer").classList.remove("open")});
async function load(){try{data=await (await fetch("/api/crm",{cache:"no-store"})).json();render()}catch(e){$("#view").innerHTML='<div class="loading">Cannot reach the server: '+esc(e.message)+"</div>"}}
$("#refresh").onclick=load;load();setInterval(load,75000);
</script>
</body>
</html>
